name: Build LibreELEC 11.0.6 Generic-legacy (RTL8852AU TX20U Plus)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-os:
    name: Build LibreELEC OS Image
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Nettoyer et maximiser l'espace disque du runner
        run: |
          echo "Libération de l'espace disque..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: 2. Installer TOUTES les dépendances requises par checkdeps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash bc bzip2 diffutils gawk gcc g++ gperf gzip file patchutils lzop make patch perl sed tar \
            unzip wget xz-utils zip zstd \
            libncurses5-dev libncurses-dev libc6-dev \
            libjson-perl libparse-yapp-perl libxml-parser-perl \
            xsltproc default-jre-headless python3 \
            xfonts-utils bdftopcf \
            build-essential libssl-dev libelf-dev libtool m4 automake libtool-bin \
            gettext u-boot-tools texinfo curl

      - name: 3. Cloner LibreELEC 11.0.6
        run: |
          git clone --depth 1 -b 11.0.6 https://github.com/LibreELEC/LibreELEC.tv.git
          echo "Dépôt LibreELEC cloné sur tag 11.0.6"

      - name: 4. Valider checkdeps
        run: |
          cd LibreELEC.tv
          ./scripts/checkdeps

      - name: 5. Injecter le pilote RTL8852AU (TP-Link Archer TX20U Plus)
        run: |
          cd LibreELEC.tv

          COMMIT="865ab0fa91471d595c283d2f3db323f7f15455f5"
          TARBALL="RTL8852AU-${COMMIT}.tar.gz"

          # Pré-télécharger la source dans le cache sources/ de LibreELEC
          mkdir -p sources/RTL8852AU
          curl -sL "https://github.com/pulponair/rtl8852au/archive/${COMMIT}.tar.gz" -o "sources/RTL8852AU/${TARBALL}"
          SHA256=$(sha256sum "sources/RTL8852AU/${TARBALL}" | cut -d' ' -f1)
          echo "Source RTL8852AU téléchargée avec SHA256: ${SHA256}"

          # Créer le répertoire du paquet
          mkdir -p packages/linux-drivers/RTL8852AU/config

          # Configuration pour autoload du module au boot
          echo "8852au" > packages/linux-drivers/RTL8852AU/config/modules.conf

          # Fichier de recette package.mk
          cat << EOF > packages/linux-drivers/RTL8852AU/package.mk
          # SPDX-License-Identifier: GPL-2.0-or-later
          # Driver Realtek RTL8852AU pour TP-Link Archer TX20U Plus (VID 0x2357:0x013f)

          PKG_NAME="RTL8852AU"
          PKG_VERSION="${COMMIT}"
          PKG_SHA256="${SHA256}"
          PKG_LICENSE="GPL"
          PKG_SITE="https://github.com/pulponair/rtl8852au"
          PKG_URL="https://github.com/pulponair/rtl8852au/archive/\${PKG_VERSION}.tar.gz"
          PKG_LONGDESC="Realtek RTL8852AU Linux driver"
          PKG_IS_KERNEL_PKG="yes"

          pre_make_target() {
            unset LDFLAGS
          }

          make_target() {
            make V=1 \\
                 ARCH=\${TARGET_KERNEL_ARCH} \\
                 KSRC=\$(kernel_path) \\
                 CROSS_COMPILE=\${TARGET_KERNEL_PREFIX}
          }

          makeinstall_target() {
            mkdir -p \${INSTALL}/\$(get_full_module_dir)/\${PKG_NAME}
            cp *.ko \${INSTALL}/\$(get_full_module_dir)/\${PKG_NAME}/
          }
          EOF

          # Activer RTL8852AU dans la liste des drivers compilés
          sed -i 's/ADDITIONAL_DRIVERS="RTL8192DU RTL8812AU"/ADDITIONAL_DRIVERS="RTL8192DU RTL8812AU RTL8852AU"/' distributions/LibreELEC/options
          grep ADDITIONAL_DRIVERS distributions/LibreELEC/options

      - name: 6. Compiler l'image LibreELEC (Generic-legacy x86_64)
        run: |
          cd LibreELEC.tv
          PROJECT=Generic DEVICE=Generic-legacy ARCH=x86_64 make image -j$(nproc) 2>&1 | tee ../build.log

      - name: 7. Vérifier et préparer le livrable et les logs
        if: always()
        run: |
          mkdir -p dist
          # Sauvegarde du log principal
          if [ -f "build.log" ]; then
            tail -n 200 build.log > dist/build_summary.log
            cp build.log dist/build_full.log
          fi
          # Sauvegarde de l'image si succès
          if [ -d "LibreELEC.tv/target" ]; then
            ls -la LibreELEC.tv/target/
            cp LibreELEC.tv/target/LibreELEC-*.img.gz* dist/ 2>/dev/null || true
            cp LibreELEC.tv/target/LibreELEC-*.tar* dist/ 2>/dev/null || true
          fi

      - name: 8. Mettre à disposition l'OS et les logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LibreELEC-11.0.6-Generic-legacy-Archer-TX20U-Plus
          path: dist/*
          retention-days: 14
