name: Build LibreELEC 11.0.6 Generic-legacy (RTL8852AU TX20U Plus)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-os:
    name: Build LibreELEC OS Image
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Nettoyer et maximiser l'espace disque du runner
        run: |
          echo "Libération de l'espace disque..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: 2. Installer les dépendances système de build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git bc libncurses5-dev libssl-dev \
            libelf-dev python3 python3-pip lzop gawk wget curl xz-utils patch unzip \
            default-jre-headless libxml-parser-perl libtool m4 automake libtool-bin \
            xsltproc xfonts-utils gettext u-boot-tools texinfo

      - name: 3. Cloner LibreELEC 11.0.6
        run: |
          git clone --depth 1 -b 11.0.6 https://github.com/LibreELEC/LibreELEC.tv.git
          echo "Dépôt LibreELEC cloné sur tag 11.0.6"

      - name: 4. Injecter le pilote RTL8852AU (TP-Link Archer TX20U Plus)
        run: |
          cd LibreELEC.tv

          COMMIT="865ab0fa91471d595c283d2f3db323f7f15455f5"
          TARBALL="RTL8852AU-${COMMIT}.tar.gz"

          # Pré-télécharger la source dans le cache de LibreELEC
          mkdir -p sources/RTL8852AU
          curl -sL "https://github.com/pulponair/rtl8852au/archive/${COMMIT}.tar.gz" -o "sources/RTL8852AU/${TARBALL}"
          SHA256=$(sha256sum "sources/RTL8852AU/${TARBALL}" | cut -d' ' -f1)
          echo "Source RTL8852AU téléchargée avec SHA256: ${SHA256}"

          # Créer le répertoire du paquet
          mkdir -p packages/linux-drivers/RTL8852AU/config

          # Configuration pour autoload au démarrage
          echo "8852au" > packages/linux-drivers/RTL8852AU/config/modules.conf

          # Fichier de recette package.mk
          cat << EOF > packages/linux-drivers/RTL8852AU/package.mk
          # SPDX-License-Identifier: GPL-2.0-or-later
          # Driver Realtek RTL8852AU pour TP-Link Archer TX20U Plus (VID 0x2357:0x013f)

          PKG_NAME="RTL8852AU"
          PKG_VERSION="${COMMIT}"
          PKG_SHA256="${SHA256}"
          PKG_LICENSE="GPL"
          PKG_SITE="https://github.com/pulponair/rtl8852au"
          PKG_URL="https://github.com/pulponair/rtl8852au/archive/\${PKG_VERSION}.tar.gz"
          PKG_LONGDESC="Realtek RTL8852AU Linux driver"
          PKG_IS_KERNEL_PKG="yes"

          pre_make_target() {
            unset LDFLAGS
          }

          make_target() {
            make V=1 \\
                 ARCH=\${TARGET_KERNEL_ARCH} \\
                 KSRC=\$(kernel_path) \\
                 CROSS_COMPILE=\${TARGET_KERNEL_PREFIX}
          }

          makeinstall_target() {
            mkdir -p \${INSTALL}/\$(get_full_module_dir)/\${PKG_NAME}
            cp *.ko \${INSTALL}/\$(get_full_module_dir)/\${PKG_NAME}/
          }
          EOF

          # Activer RTL8852AU dans la liste des drivers compilés
          sed -i 's/ADDITIONAL_DRIVERS="RTL8192DU RTL8812AU"/ADDITIONAL_DRIVERS="RTL8192DU RTL8812AU RTL8852AU"/' distributions/LibreELEC/options
          grep ADDITIONAL_DRIVERS distributions/LibreELEC/options

      - name: 5. Compiler l'image LibreELEC (Generic-legacy x86_64)
        run: |
          cd LibreELEC.tv
          PROJECT=Generic DEVICE=Generic-legacy ARCH=x86_64 make image -j$(nproc)

      - name: 6. Vérifier et préparer le livrable
        if: always()
        run: |
          cd LibreELEC.tv
          mkdir -p ../dist
          if [ -d "target" ]; then
            ls -la target/
            cp target/LibreELEC-*.img.gz* ../dist/ 2>/dev/null || true
            cp target/LibreELEC-*.tar* ../dist/ 2>/dev/null || true
          fi

      - name: 7. Mettre à disposition l'OS à télécharger
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LibreELEC-11.0.6-Generic-legacy-Archer-TX20U-Plus
          path: dist/*
          retention-days: 14
